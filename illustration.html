<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustration｜甘目あめ</title><style>
:root{--bg:#fffdfd;--text:#55505a;--muted:#a79da8;--pink:#d9b9c7;--line:#eee6eb;--lav:#f2edf7;--rose:#f7edf1;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.8;letter-spacing:.035em}a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:auto;padding:0 28px}.top{padding:76px 20px 52px;text-align:center}.ey{font-size:12px;letter-spacing:.28em;color:var(--pink)}.title{font-size:42px;font-weight:400;letter-spacing:.08em;margin:20px 0 0}.lead{color:var(--muted);font-size:13px}
.about{text-align:center;padding:40px 20px 92px}.avatar{width:150px;height:150px;border:1px dashed #ddd2da;border-radius:50%;margin:0 auto 80px;display:grid;place-items:center;color:#b8acb8;font-size:12px;background:linear-gradient(135deg,#fcf8fa,#f7f3fa)}.about .ey{margin-bottom:22px}.name{font-size:38px;font-weight:400;margin:10px 0 14px}.role{font-size:18px;margin:0 0 18px}.bio{color:var(--muted);font-size:14px}.social{display:flex;justify-content:center;gap:26px;margin-top:25px;font-size:13px}
.home-cards{display:grid;gap:28px;padding:0 28px 95px;max-width:1000px;margin:auto}.home-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 28px rgba(120,100,120,.035)}.home-image{height:330px;background:linear-gradient(135deg,#fbf7fa,#f4f0f7);display:grid;place-items:center;color:#b6aab7;border-bottom:1px dashed #ddd3db}.home-label{display:flex;justify-content:space-between;align-items:center;padding:24px 28px;font-size:17px}.home-label span{font-size:13px;color:#a99da9}.commission{max-width:944px;margin:0 auto 90px;border-radius:20px;background:linear-gradient(120deg,var(--lav),var(--rose));text-align:center;padding:62px 20px}.commission .big{font-size:28px;margin:15px 0 25px}.button{display:inline-block;background:#fff;border-radius:999px;padding:13px 34px;color:#665d66;box-shadow:0 5px 20px rgba(120,100,120,.08)}
footer{border-top:1px solid var(--line);text-align:center;padding:35px;color:#b1a7b1;font-size:11px}
.pagehead{text-align:center;padding:75px 20px 55px}.pagehead h1{font-size:40px;font-weight:400;margin:15px 0}.back{font-size:12px;color:var(--muted)}.gallery{max-width:1000px;margin:auto;padding:0 28px 100px}.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.piece{border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line)}.piece-img{aspect-ratio:1/1.05;background:linear-gradient(135deg,#faf7f8,#f3eef5);display:grid;place-items:center;color:#b3a8b4}.piece img{width:100%;height:100%;object-fit:cover}.piece-cap{padding:17px 19px;font-size:13px}.empty{text-align:center;color:var(--muted);padding:80px 0}
.order-list{max-width:900px;margin:auto;padding:0 28px 100px}.order-section{margin-bottom:65px}.order-section h2{font-weight:400;font-size:25px;text-align:center}.order-section .sub{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.18em}.price{width:100%;border-collapse:collapse;margin-top:25px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.price th,.price td{padding:15px 18px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}.price th{background:#faf5f7;font-weight:400}.steps{display:grid;gap:12px;margin-top:25px}.step{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:#fff}.num{color:var(--pink);font-weight:bold}.note{white-space:pre-line;color:var(--muted);font-size:13px;background:#fff;padding:20px;border:1px solid var(--line);border-radius:14px}.faq details{border-bottom:1px solid var(--line);padding:16px}.faq summary{cursor:pointer;font-size:13px}.faq p{color:var(--muted);font-size:12px}
.admin{background:#f9f7f8}.admin main{max-width:900px;margin:auto;padding:35px 20px 80px}.admin h1{font-weight:400}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}.admin label{display:block;font-size:12px;margin:13px 0 5px}.admin input,.admin textarea{width:100%;padding:10px;border:1px solid #ddd4dc;border-radius:9px;font:inherit;box-sizing:border-box}.admin textarea{min-height:85px}.admin button{border:0;background:#e4c3cf;color:#584f56;border-radius:999px;padding:10px 18px;margin:6px 4px 0 0}.item{border-top:1px solid var(--line);padding:15px 0}.small{font-size:11px;color:#a1979e}
@media(max-width:650px){.title{font-size:32px}.name{font-size:32px}.avatar{margin-bottom:50px}.home-image{height:220px}.home-label{padding:19px;font-size:15px}.home-label span{font-size:11px}.gallery-grid{grid-template-columns:1fr}.pagehead h1{font-size:34px}}
.home-image{position:relative;overflow:hidden}.home-image img,.piece-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.piece-img{position:relative;overflow:hidden}.home-label{position:relative;z-index:1;background:#fff}.gnav{display:flex;gap:4px 20px;padding:14px 14px;font-size:12px;letter-spacing:.06em;overflow-x:auto;white-space:nowrap;border-bottom:1px solid #eee6eb;background:rgba(255,255,255,.88);position:sticky;top:0;z-index:20;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}.gnav a{color:#a79da8;padding:4px 2px;text-decoration:none}.gnav a:first-child{margin-left:auto}.gnav a:last-child{margin-right:auto}.gnav a.on{color:#665d66;border-bottom:1px solid #665d66}</style></head><body><nav class="gnav"><a href="index.html">HOME</a><a href="illustration.html" class=on>Illustration</a><a href="model.html">2D Model</a><a href="commission.html">ご依頼</a><a href="recruit.html">魂募集</a></nav><div class="wrap" style="padding-top:18px"><a class="back" href="index.html">← 甘目あめ</a></div><header class="pagehead"><div class="ey">WORKS</div><h1 id="ptitle">Illustration</h1><p class="lead" id="psub">イラスト制作実績</p></header><main class="gallery"><div id="grid"></div></main><footer>© 甘目あめ</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="site.js"></script><script type="module">
const def={illust:[{title:"Illustration 01"},{title:"Illustration 02"},{title:"Illustration 03"}],model:[{title:"2D Model 01"},{title:"2D Model 02"},{title:"2D Model 03"}]};
const d=await loadData(def);const type=location.pathname.includes("model")?"model":"illust";if(type==="model"){ptitle.innerText="2D Model";psub.innerText="Live2D制作実績";}
const card=x=>`<article class="piece"><div class="piece-img">${x.image?`<img src="${esc(x.image)}">`:"作品画像（仮）"}</div><div class="piece-cap">${esc(x.title)}</div></article>`;
const sec=(en,ja,note,a)=>a.length?`<section style="margin-bottom:64px"><div style="text-align:center;margin-bottom:26px"><div class="ey">${en}</div><h2 style="font-size:22px;font-weight:400;margin:6px 0 2px">${ja}</h2><p class="lead" style="margin:0">${note}</p></div><div class="gallery-grid">${a.map(card).join("")}</div></section>`:"";
grid.innerHTML=sec("WORKS","制作実績","ご依頼いただいた作品",d[type].filter(x=>x.category==="work"))+sec("SAMPLE","サンプル","オリジナルのサンプル作品です",d[type].filter(x=>x.category!=="work"))||'<div class="empty">作品を準備中です</div>';
</script></body></html>
