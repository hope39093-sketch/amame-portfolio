<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>管理画面｜甘目あめ</title><style>
:root{--bg:#fffdfd;--text:#55505a;--muted:#a79da8;--pink:#d9b9c7;--line:#eee6eb;--lav:#f2edf7;--rose:#f7edf1;--white:#fff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.8;letter-spacing:.035em}a{color:inherit;text-decoration:none}
.wrap{max-width:1000px;margin:auto;padding:0 28px}.top{padding:76px 20px 52px;text-align:center}.ey{font-size:12px;letter-spacing:.28em;color:var(--pink)}.title{font-size:42px;font-weight:400;letter-spacing:.08em;margin:20px 0 0}.lead{color:var(--muted);font-size:13px}
.about{text-align:center;padding:40px 20px 92px}.avatar{width:150px;height:150px;border:1px dashed #ddd2da;border-radius:50%;margin:0 auto 80px;display:grid;place-items:center;color:#b8acb8;font-size:12px;background:linear-gradient(135deg,#fcf8fa,#f7f3fa)}.about .ey{margin-bottom:22px}.name{font-size:38px;font-weight:400;margin:10px 0 14px}.role{font-size:18px;margin:0 0 18px}.bio{color:var(--muted);font-size:14px}.social{display:flex;justify-content:center;gap:26px;margin-top:25px;font-size:13px}
.home-cards{display:grid;gap:28px;padding:0 28px 95px;max-width:1000px;margin:auto}.home-card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 28px rgba(120,100,120,.035)}.home-image{height:330px;background:linear-gradient(135deg,#fbf7fa,#f4f0f7);display:grid;place-items:center;color:#b6aab7;border-bottom:1px dashed #ddd3db}.home-label{display:flex;justify-content:space-between;align-items:center;padding:24px 28px;font-size:17px}.home-label span{font-size:13px;color:#a99da9}.commission{max-width:944px;margin:0 auto 90px;border-radius:20px;background:linear-gradient(120deg,var(--lav),var(--rose));text-align:center;padding:62px 20px}.commission .big{font-size:28px;margin:15px 0 25px}.button{display:inline-block;background:#fff;border-radius:999px;padding:13px 34px;color:#665d66;box-shadow:0 5px 20px rgba(120,100,120,.08)}
footer{border-top:1px solid var(--line);text-align:center;padding:35px;color:#b1a7b1;font-size:11px}
.pagehead{text-align:center;padding:75px 20px 55px}.pagehead h1{font-size:40px;font-weight:400;margin:15px 0}.back{font-size:12px;color:var(--muted)}.gallery{max-width:1000px;margin:auto;padding:0 28px 100px}.gallery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.piece{border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line)}.piece-img{aspect-ratio:1/1.05;background:linear-gradient(135deg,#faf7f8,#f3eef5);display:grid;place-items:center;color:#b3a8b4}.piece img{width:100%;height:100%;object-fit:cover}.piece-cap{padding:17px 19px;font-size:13px}.empty{text-align:center;color:var(--muted);padding:80px 0}
.order-list{max-width:900px;margin:auto;padding:0 28px 100px}.order-section{margin-bottom:65px}.order-section h2{font-weight:400;font-size:25px;text-align:center}.order-section .sub{text-align:center;color:var(--muted);font-size:11px;letter-spacing:.18em}.price{width:100%;border-collapse:collapse;margin-top:25px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}.price th,.price td{padding:15px 18px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}.price th{background:#faf5f7;font-weight:400}.steps{display:grid;gap:12px;margin-top:25px}.step{display:grid;grid-template-columns:52px 1fr;gap:12px;padding:18px 20px;border:1px solid var(--line);border-radius:14px;background:#fff}.num{color:var(--pink);font-weight:bold}.note{white-space:pre-line;color:var(--muted);font-size:13px;background:#fff;padding:20px;border:1px solid var(--line);border-radius:14px}.faq details{border-bottom:1px solid var(--line);padding:16px}.faq summary{cursor:pointer;font-size:13px}.faq p{color:var(--muted);font-size:12px}
.admin{background:#f9f7f8}.admin main{max-width:900px;margin:auto;padding:35px 20px 80px}.admin h1{font-weight:400}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}.admin label{display:block;font-size:12px;margin:13px 0 5px}.admin input,.admin textarea{width:100%;padding:10px;border:1px solid #ddd4dc;border-radius:9px;font:inherit;box-sizing:border-box}.admin textarea{min-height:85px}.admin button{border:0;background:#e4c3cf;color:#584f56;border-radius:999px;padding:10px 18px;margin:6px 4px 0 0}.item{border-top:1px solid var(--line);padding:15px 0}.small{font-size:11px;color:#a1979e}
@media(max-width:650px){.title{font-size:32px}.name{font-size:32px}.avatar{margin-bottom:50px}.home-image{height:220px}.home-label{padding:19px;font-size:15px}.home-label span{font-size:11px}.gallery-grid{grid-template-columns:1fr}.pagehead h1{font-size:34px}}
</style><style>
.thumb{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid #eee6eb;background:#faf7f8;flex:none}
.item.work{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item.work input{flex:1;min-width:140px}
h3{font-size:14px;font-weight:400;color:#a79da8;margin:22px 0 8px}#login{max-width:360px;margin:90px auto;padding:0 20px}#login input{width:100%;margin:6px 0 14px}
</style></head><body>
<div id="login" style="display:none"><h1>管理画面ログイン</h1><label>メールアドレス</label><input id="em" type="email" autocomplete="username"><label>パスワード</label><input id="pw" type="password" autocomplete="current-password"><button onclick="login()">ログイン</button><p id="lmsg" class="small"></p></div>
<div class="admin" id="app" style="display:none"><main>
<p><a href="index.html">← 公開サイト</a>　<a href="#" onclick="logout();return false">ログアウト</a></p><h1>甘目あめ 管理画面</h1>
<p class="small">変更したら、一番下の「変更を保存」を押してください。（作品の追加・削除・画像変更はすぐ反映されます）</p>
<div class="panel"><h2>About</h2><label>名前</label><input id="name"><label>肩書き</label><input id="role"><label>プロフィール</label><textarea id="bio"></textarea><label>SNS</label><input id="social"><label>お問い合わせ用メールアドレス</label><input id="contact" type="email"></div>
<div class="panel"><h2>Illustration</h2><h3>制作実績（ご依頼いただいた作品）</h3><div id="illust_work"></div><button onclick="addPick('illust','work')">＋実績を追加</button><h3>サンプル（オリジナル作品）</h3><div id="illust_sample"></div><button onclick="addPick('illust','sample')">＋サンプルを追加</button></div>
<div class="panel"><h2>2D Model</h2><h3>制作実績（ご依頼いただいた作品）</h3><div id="model_work"></div><button onclick="addPick('model','work')">＋実績を追加</button><h3>サンプル（オリジナル作品）</h3><div id="model_sample"></div><button onclick="addPick('model','sample')">＋サンプルを追加</button></div>
<div class="panel"><h2>ご依頼</h2><label>立ち絵の範囲図（料金表の下に、開閉ボタンで表示されます）</label><div id="guidebox"></div><button onclick="pickGuide()">画像を選ぶ</button><button onclick="collect();d.guide='';render()">削除</button><label>料金表（1行 = メニュー / 料金 / 備考）　※追加料金・オプションは、料金を「+¥1,000」「+20%」のように「+」から書くと、見積もりシミュレーターでオプション扱いになります</label><div id="prices"></div><button onclick="addPrice()">＋料金を追加</button><label>ご依頼の流れ</label><div id="flows"></div><button onclick="addFlow()">＋工程を追加</button><label>ご依頼テンプレート</label><textarea id="template"></textarea><label>ご利用規約</label><textarea id="terms"></textarea><label>FAQ</label><div id="faqs"></div><button onclick="addFaq()">＋FAQを追加</button></div>
<button onclick="save()">変更を保存</button><p id="msg" class="small"></p></main></div>
<input type="file" id="file" accept="image/*" hidden>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="site.js"></script><script>
const $=id=>document.getElementById(id);
const def={name:"甘目あめ",role:"Illustrator / Live2D Creator",bio:"イラストと2Dモデルを中心に制作しています。",social:"X　 Instagram　 Pixiv",contact:"",illust:[],model:[],price:[["立ち絵イラスト","¥15,000〜","内容により変動"],["一枚絵","¥20,000〜","背景・小物等で変動"],["Live2Dモデリング","¥30,000〜","パーツ数・可動域で変動"]],flow:["お問い合わせ・ご相談","内容確認・お見積もり","お支払い・制作開始","確認・修正","納品"],template:"【お名前 / ハンドルネーム】\n【ご依頼内容】\n【使用用途】\n【納期】\n【ご予算】\n【参考資料・イメージ】\n【その他ご希望】",terms:"こちらは仮文です。正式公開前に、商用利用・著作権・修正・キャンセル・禁止事項などを設定してください。",faq:[["個人でも依頼できますか？","はい。個人の方からのご依頼を想定しています。"],["料金表にない依頼もできますか？","内容によって対応可能です。お気軽にご相談ください。"]]};
let d;
const msg=t=>$("msg").textContent=t;
function show(w){$("login").style.display=w==="login"?"block":"none";$("app").style.display=w==="app"?"block":"none"}
async function login(){$("lmsg").textContent="ログイン中…";const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});if(error){$("lmsg").textContent="ログインできませんでした。メールとパスワードを確認してください。";return}$("pw").value="";start()}
async function logout(){await sb.auth.signOut();show("login")}
async function start(){show("app");d=await loadData(def);render();if(d._err)msg("データを読み込めませんでした。再読み込みしてください。（この状態で保存しないでください）")}
function render(){
$("name").value=d.name;$("role").value=d.role;$("bio").value=d.bio;$("social").value=d.social;$("contact").value=d.contact||"";
["illust","model"].forEach(k=>["work","sample"].forEach(c=>$(k+"_"+c).innerHTML=d[k].map((x,i)=>[x,i]).filter(([x])=>(x.category||"sample")===c).map(([x,i])=>`<div class="item work">${x.image?`<img class="thumb" src="${esc(x.image)}">`:'<div class="thumb"></div>'}<input data-a="${k}" data-i="${i}" value="${esc(x.title)}"><button onclick="mv('${k}',${i},-1)">↑</button><button onclick="mv('${k}',${i},1)">↓</button><button onclick="pick('${k}',${i})">画像変更</button><button onclick="mvCat('${k}',${i})">${c==="work"?"サンプルへ":"実績へ"}</button><button onclick="del('${k}',${i})">削除</button></div>`).join("")||'<p class="small">まだありません</p>'));
$("prices").innerHTML=d.price.map((x,i)=>`<div class="item"><input data-p="${i}" value="${esc(x[0])}" placeholder="メニュー"><input data-p="${i}" data-c="1" value="${esc(x[1])}" placeholder="料金"><input data-p="${i}" data-c="2" value="${esc(x[2])}" placeholder="備考"><button onclick="collect();d.price.splice(${i},1);render()">削除</button></div>`).join("");
$("flows").innerHTML=d.flow.map((x,i)=>`<div class="item"><input data-f="${i}" value="${esc(x[0])}" placeholder="タイトル"><textarea data-f="${i}" data-c="1" placeholder="説明（短い文章）">${esc(x[1])}</textarea><button onclick="collect();d.flow.splice(${i},1);render()">削除</button></div>`).join("");
$("template").value=d.template;$("guidebox").innerHTML=d.guide?`<img class="thumb" style="width:140px;height:auto" src="${esc(d.guide)}">`:'<p class="small">未設定</p>';$("terms").value=d.terms;
$("faqs").innerHTML=d.faq.map((x,i)=>`<div class="item"><input data-q="${i}" value="${esc(x[0])}" placeholder="質問"><input data-q="${i}" data-c="1" value="${esc(x[1])}" placeholder="回答"><button onclick="collect();d.faq.splice(${i},1);render()">削除</button></div>`).join("");}
function collect(){d.name=$("name").value;d.role=$("role").value;d.bio=$("bio").value;d.social=$("social").value;d.contact=$("contact").value;
document.querySelectorAll("input[data-a]").forEach(e=>d[e.dataset.a][e.dataset.i].title=e.value);
document.querySelectorAll("input[data-p]").forEach(e=>d.price[e.dataset.p][e.dataset.c||0]=e.value);
document.querySelectorAll("[data-f]").forEach(e=>d.flow[e.dataset.f][e.dataset.c||0]=e.value);
document.querySelectorAll("input[data-q]").forEach(e=>d.faq[e.dataset.q][e.dataset.c||0]=e.value);
d.template=$("template").value;d.terms=$("terms").value}
function pickGuide(){chooser(false,async([f])=>{collect();msg("アップロード中…");try{d.guide=await upload("guide",f);render();msg("画像を設定しました。「変更を保存」を押してください。")}catch(e){msg("失敗しました："+e.message)}})}
function addPrice(){collect();d.price.push(["新しいメニュー","¥0",""]);render()}
function addFlow(){collect();d.flow.push(["新しい工程",""]);render()}
function addFaq(){collect();d.faq.push(["新しい質問","回答"]);render()}
function mv(k,i,s){collect();const c=d[k][i].category;let j=i+s;while(d[k][j]&&d[k][j].category!==c)j+=s;if(!d[k][j])return;[d[k][i],d[k][j]]=[d[k][j],d[k][i]];render();msg("順番を変えました。「変更を保存」を押してください。")}
function mvCat(k,i){collect();const x=d[k][i];x.category=x.category==="work"?"sample":"work";render();msg("移動しました。「変更を保存」を押してください。")}
// 画像：スマホの大きな写真は縮小してから保存（読み込みが速くなります）
async function shrink(f){const b=await createImageBitmap(f,{imageOrientation:"from-image"});const s=Math.min(1,1800/Math.max(b.width,b.height));const c=document.createElement("canvas");c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.88))}
async function upload(k,f){const blob=await shrink(f);const path=`${k}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;const {error}=await sb.storage.from("works").upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000"});if(error)throw error;return sb.storage.from("works").getPublicUrl(path).data.publicUrl}
const pathOf=u=>{const i=(u||"").indexOf("/works/");return i<0?null:u.slice(i+7)};
function chooser(multi,fn){const f=$("file");f.multiple=multi;f.value="";f.onchange=()=>{if(f.files.length)fn([...f.files])};f.click()}
function addPick(k,c){chooser(true,async fs=>{collect();for(const f of fs){msg("アップロード中…");try{const url=await upload(k,f);const {data,error}=await sb.from("works").insert({type:k,title:"新しい作品",image_url:url,sort:d[k].length,category:c}).select().single();if(error)throw error;d[k].push({id:data.id,title:data.title,image:url,category:c})}catch(e){msg("失敗しました："+e.message);return}}render();msg("追加しました。タイトルを入力して「変更を保存」を押してください。")})}
function pick(k,i){chooser(false,async([f])=>{collect();msg("アップロード中…");try{const x=d[k][i],old=pathOf(x.image),url=await upload(k,f);const {error}=await sb.from("works").update({image_url:url}).eq("id",x.id);if(error)throw error;x.image=url;if(old)await sb.storage.from("works").remove([old]);render();msg("画像を変えました。")}catch(e){msg("失敗しました："+e.message)}})}
async function del(k,i){if(!confirm("この作品を削除しますか？"))return;collect();const x=d[k][i],p=pathOf(x.image);if(p)await sb.storage.from("works").remove([p]);const {error}=await sb.from("works").delete().eq("id",x.id);if(error)return msg("失敗しました："+error.message);d[k].splice(i,1);render();msg("削除しました。")}
async function save(){collect();msg("保存中…");const {name,role,bio,social,contact,price,flow,template,terms,faq}=d,guide=d.guide||"";
const rs=await Promise.all([sb.from("site_data").upsert({id:1,data:{name,role,bio,social,contact,price,flow,template,terms,faq,guide}}),...["illust","model"].flatMap(k=>d[k].map((x,i)=>sb.from("works").update({title:x.title,sort:i,category:x.category||"sample"}).eq("id",x.id)))]);
const e=rs.find(r=>r.error);msg(e?"保存できませんでした："+e.error.message:"保存しました。公開サイトに反映されています。")}
(async()=>{const {data:{session}}=await sb.auth.getSession();session?start():show("login")})();
</script></body></html>
